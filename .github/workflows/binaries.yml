name: Build Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cosmic-cupid-linux
          - os: windows-latest
            asset_name: cosmic-cupid-windows.exe
          - os: macos-latest
            asset_name: cosmic-cupid-macos

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller
    
    - name: Build executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile --name cosmic-cupid \
          --add-data "src:src" \
          --collect-all rich \
          --collect-all kerykeion \
          --collect-all PIL \
          src/main.py
    
    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --name cosmic-cupid `
          --add-data "src;src" `
          --collect-all rich `
          --collect-all kerykeion `
          --collect-all PIL `
          src/main.py
    
    - name: Find and rename executable
      run: |
        mv dist/cosmic-cupid* ${{ matrix.asset_name }}
      shell: bash
    
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
