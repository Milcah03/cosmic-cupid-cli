name: Build Binaries

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cosmic-cupid-linux
          - os: windows-latest
            asset_name: cosmic-cupid-windows.exe
          - os: macos-latest
            asset_name: cosmic-cupid-macos

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pyinstaller
    
    - name: Build executable (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile --name cosmic-cupid \
          --add-data "src:src" \
          --collect-all rich \
          --collect-all kerykeion \
          --collect-all PIL \
          src/main.py
    
    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --name cosmic-cupid `
          --add-data "src;src" `
          --collect-all rich `
          --collect-all kerykeion `
          --collect-all PIL `
          src/main.py
    
    - name: Find and rename executable
      run: |
        mv dist/cosmic-cupid* ${{ matrix.asset_name }}
      shell: bash
    
    - name: Upload Release Asset
      run: |
        RELEASE_ID=$(curl -s https://api.github.com/repos/Milcah03/cosmic-cupid-cli/releases/tags/v0.1.0 | grep '"id"' | head -1 | grep -oP ':\s*\K[0-9]+')
        curl -X POST \
          -H "Authorization: token ${{ github.token }}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"${{ matrix.asset_name }}" \
          "https://uploads.github.com/repos/Milcah03/cosmic-cupid-cli/releases/${RELEASE_ID}/assets?name=${{ matrix.asset_name }}"
